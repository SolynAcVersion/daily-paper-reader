    - tag: psd
      description: >-
        物理合理性视频生成领域，对基础模型使用监督微调（SFT）所用的数据集等。不一定要标注好的 mask：和 WISA-80K 一样，是现实世界的物理一致性等数据集 不要合成数据，不要第一人称视角（尤其是带有机械臂操作的）
        内容以物理视频为主，如小球碰撞、自由落体等 最好是单一主体，prompt 最好短一些。感觉最好能包含复杂一些的物理运动 也不用都是刚体的 那种液体的、热力学的、电磁学的这种 有没有自带mask倒还好 也可以再跑分割。
        不要是cg合成的（如blender脚本生成），可以从多个互联网视频里面晒出.
