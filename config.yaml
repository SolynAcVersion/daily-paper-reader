    - tag: cad-spatial
      description: >-
        CAD 空间理解（Spatial Understanding from Orthographic
        Views）研究背景：工程图三视图（主视/俯视/左视）是人类传递三维几何信息最紧凑的载体，但机器要从二维线框恢复三维空间语义，需要同时完成视图配准、投影关系推理与几何量估计。核心问题：能否从三视图（或三视图+尺寸标注）中自动、定量地读出零件的长/宽/高、包络体积、表面积、关键特征尺寸，并达到工程可用精度？技术路线：1.
        构建「三视图 → 三维几何属性」的监督数据集（可用 CAD 模型自动渲染三视图并回填真值）；2. 采用视觉编码器 + 几何推理头（回归尺寸/体积/面积），或引入隐式三维表示（如 triplane /
        SDF）作为中间监督；3. 探索「显式投影约束」注入，提升尺度一致性与可解释性。Benchmark 设计：- 指标：尺寸 MAE/MAPE（相对误差）、体积/面积相对误差、包络盒 IoU；- 难度分层：单实体 /
        多实体、含孔槽特征 / 纯回转体、有无尺寸标注；- 需报告尺度不变性与跨类别泛化结果。预期贡献：首个面向「几何量定量读出」的三视图理解 benchmark，明确当前模型在工程精度（如 ±1%）上的差距。
      enabled: true
      paper_sources:
