    - tag: psd
      description: >-
        物理合理性视频生成领域，对基础模型使用监督微调（SFT）所用的数据集等。不一定要标注好的 mask：和 WISA-80K 一样，是现实世界的物理一致性等数据集 不要合成数据，不要第一人称视角（尤其是带有机械臂操作的）
        内容以物理视频为主，如小球碰撞、自由落体等 最好是单一主体，prompt 最好短一些。感觉最好能包含复杂一些的物理运动 也不用都是刚体的 那种液体的、热力学的、电磁学的这种 有没有自带mask倒还好 也可以再跑分割。
        不要是cg合成的（如blender脚本生成），可以从多个互联网视频里面晒出.
      enabled: true
      paper_sources:
        - arxiv
      keywords:
        - keyword: physics plausibility dataset
          keyword_cn: 物理合理性数据集
          query: physics plausibility dataset in video generation
        - keyword: video generation fine-tuning data
          keyword_cn: 视频生成微调数据
          query: fine-tuning data for video generation with physics
        - keyword: physics-based video dataset
          keyword_cn: 基于物理的视频数据集
          query: physics-based video dataset for fine-tuning
        - keyword: real-world physics video
          keyword_cn: 真实世界物理视频
          query: real-world physics video recorded from natural scenes without synthetic rendering
        - keyword: single object motion
          keyword_cn: 单一物体运动
          query: motion of a single object with complex trajectory
      intent_queries:
        - query: find datasets for supervised fine tuning of physically plausible video generation models
          query_cn: 寻找用于物理合理性视频生成模型监督微调的数据集
          enabled: true
          source: manual
          note: ''
        - query: search for SFT fine tuning data for physics aware video synthesis
          query_cn: 搜索用于物理感知视频合成的SFT微调数据
          enabled: true
          source: manual
          note: ''
        - query: >-
            Find real world video datasets of physical phenomena such as collisions and free fall for supervised fine
            tuning.
          query_cn: 寻找用于监督微调的真实世界物理现象视频数据集，如碰撞和自由落体。
          enabled: true
          source: manual
          note: ''
        - query: Retrieve human captured clips of complex physical behavior without CGI or first person robot arm views.
          query_cn: 检索真人拍摄的复杂物理行为片段，无CGI或第一人称机械臂视角。
          enabled: true
          source: manual
          note: ''
